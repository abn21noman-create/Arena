<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background gradient -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle shine -->
  <rect width="512" height="256" rx="96" fill="url(#shine)"/>
  <!-- Book icon -->
  <g transform="translate(256 180)" fill="white">
    <rect x="-90" y="-50" width="180" height="100" rx="8" opacity="0.95"/>
    <rect x="-90" y="-50" width="180" height="14" rx="4" fill="white" opacity="0.4"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#3b82f6" stroke-width="3"/>
    <line x1="-70" y1="-20" x2="-15" y2="-20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="-25" y2="0" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="20" x2="-30" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="-20" x2="70" y2="-20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="0" x2="65" y2="0" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="20" x2="60" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- HSC text -->
  <text x="256" y="370" text-anchor="middle" fill="white" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="100" letter-spacing="-2">HSC</text>
  <!-- Ultimate text -->
  <text x="256" y="440" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-weight="600" font-size="44" opacity="0.95" letter-spacing="2">ULTIMATE</text>
</svg>
