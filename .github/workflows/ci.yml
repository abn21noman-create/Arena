name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hsc-ultimate

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hsc-ultimate/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint (zero warnings)
        run: npm run lint -- --max-warnings=0

  test:
    name: Unit, Logic & Security Audits
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hsc-ultimate/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Unit tests
        run: npm run test:run

      - name: Pure logic assertions
        run: npm run test:logic

      - name: Seed integrity
        run: npm run test:seed

      - name: Strict API security manifest
        run: npm run audit:security:strict -- --out reports/ci-api-security.json

      - name: Strict privacy compliance manifest
        run: npm run audit:privacy:strict -- --out reports/ci-privacy-compliance.json

      - name: Strict runtime truth/integrity manifest
        run: npm run audit:integrity:strict -- --out reports/ci-runtime-integrity.json

      - name: Strict UX integrity manifest
        run: npm run audit:ux:strict

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: hsc-ultimate/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          NEXTAUTH_SECRET: "placeholder-secret-for-ci-build-only-32-chars"
          NEXTAUTH_URL: "http://localhost:3000"
          GROQ_API_KEY: "placeholder"
          MISTRAL_API_KEY: "placeholder"
          CEREBRAS_API_KEY: "placeholder"
          OPENROUTER_API_KEY: "placeholder"
          RESEND_API_KEY: "placeholder"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "placeholder"
          VAPID_PRIVATE_KEY: "placeholder"
          VAPID_SUBJECT: "mailto:test@test.com"
